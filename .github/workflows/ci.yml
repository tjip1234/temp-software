name: CI

on:
  push:
    # The default branch is master. Listing only main meant no push ever ran
    # CI -- and a push filter with branches but no tags ignores tags entirely,
    # so pushing a release tag never reached the package job below.
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # PySide6 needs a handful of X libraries even to run offscreen.
      - name: Install Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" httpx

      - name: Lint
        run: ruff check src tests

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -q --durations=10

  reference-codec:
    name: C reference codec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the host codec
        run: python -m pip install -e .

      - name: Build and self-test
        working-directory: firmware-ref
        run: make test

      # The check that keeps the specification honest: the C the firmware will
      # use and the Python the desktop uses must emit identical bytes.
      - name: Cross-check against the Python codec
        working-directory: firmware-ref
        run: make crosscheck

  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # Three artifacts, three runners: an AppImage, a .dmg and an .exe.
        # The Linux runner is deliberately the oldest one available: glibc is
        # not forward-compatible, so an AppImage built against a newer glibc
        # refuses to start on anything older, while one built on an old
        # distribution runs everywhere newer.
        include:
          - os: ubuntu-22.04
            artifact: AppImage
          - os: macos-latest
            artifact: dmg
          - os: windows-latest
            artifact: exe

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfuse2 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0
          ./packaging/linux/build_appimage.sh

      - name: Build the macOS app and dmg
        if: runner.os == 'macOS'
        run: ./packaging/macos/build.sh

      - name: Build the Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: tjiptemp-${{ matrix.artifact }}
          path: |
            dist/*.AppImage
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

  # A second Linux AppImage that carries its own glibc, so it runs on any
  # distribution regardless of age. quick-sharun, which assembles it, is written
  # for Arch, hence the official Arch image; the host's age does not matter here.
  package-anylinux:
    name: Package (AppImage, any Linux)
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    container: archlinux:latest
    steps:
      # Python, the tools quick-sharun calls (patchelf, strip, strings, wget),
      # and the Qt runtime libraries the bundle links against: sharun can only
      # deploy what is installed.
      - name: Install build dependencies
        run: |
          pacman -Syu --needed --noconfirm \
            git base-devel wget patchelf python \
            fontconfig dbus wayland krb5 mesa libglvnd \
            libxkbcommon-x11 xcb-util-cursor xcb-util-image xcb-util-keysyms \
            xcb-util-renderutil xcb-util-wm libxcomposite libxdamage \
            libxinerama libxi libxcursor
          python -m venv /opt/venv

      - uses: actions/checkout@v4

      - name: Build the AppImage
        run: PYTHON=/opt/venv/bin/python ./packaging/linux/build_anylinux_appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tjiptemp-AppImage-anylinux
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [package, package-anylinux]
    # Only for a version tag. A manual run builds the three artifacts so they
    # can be checked, without publishing anything.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish the AppImage, dmg and exe as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "TjipTemp ${GITHUB_REF_NAME#v}" \
            --generate-notes
